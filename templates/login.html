{% extends "base.html" %}

{% block title %}Login - Library System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header text-center">
                <h4><i class="fas fa-sign-in-alt"></i> Login</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="user_id" class="form-label">User ID</label>
                        <input type="number" class="form-control" id="user_id" name="user_id" 
                               placeholder="Enter your user ID" required>
                        <div class="form-text">
                            Enter a valid user ID that exists in our system
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>
            </div>
            <div class="card-footer text-center">
                <small class="text-muted">
                    Only existing user IDs from our database are accepted.
                </small>
            </div>
        </div>
        
        <!-- Demo Users -->
        <div class="card mt-3">
            <div class="card-header">
                <h6><i class="fas fa-users"></i> Demo Users</h6>
            </div>
            <div class="card-body">
                <p class="small text-muted">Try these valid user IDs:</p>
                <div class="row">
                    <div class="col-6">
                        <button class="btn btn-outline-primary btn-sm w-100 mb-2" onclick="setUserId(12874)">
                            User 12874
                        </button>
                        <button class="btn btn-outline-primary btn-sm w-100 mb-2" onclick="setUserId(52036)">
                            User 52036
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-primary btn-sm w-100 mb-2" onclick="setUserId(314)">
                            User 314
                        </button>
                        <button class="btn btn-outline-primary btn-sm w-100 mb-2" onclick="setUserId(1000)">
                            User 1000
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function setUserId(userId) {
    document.getElementById('user_id').value = userId;
}
</script>
{% endblock %}
